<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" role="img" aria-label="Cassio Bona Eulalio — descriptografia">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#E3B341"/>
      <stop offset="1" stop-color="#FFC400"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#FFC400" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- recorte que apaga o binario da esquerda pra direita -->
    <clipPath id="reveal">
      <rect x="120" y="112" width="760" height="72">
        <animate attributeName="width" from="760" to="0" begin="1.1s" dur="1.7s" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- digitacao do prompt -->
    <clipPath id="promptClip">
      <rect x="148" y="62" width="0" height="30">
        <animate attributeName="width" from="0" to="420" dur="0.9s" begin="0.15s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="260" fill="#000000"/>
  <rect width="1000" height="260" fill="url(#glow)"/>

  <!-- brilho atras do nome -->
  <text x="500" y="162" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs"
        font-family="'JetBrains Mono','Fira Code',monospace" font-size="46" font-weight="700"
        fill="#FFC400" opacity="0.25" filter="url(#soft)">CASSIO BONA EULALIO</text>

  <!-- prompt digitando -->
  <text x="150" y="84" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#3FB950" clip-path="url(#promptClip)">root@nest:~# ./decrypt cassio-bona.gpg --binary</text>

  <!-- NOME (destino final) -->
  <text x="500" y="162" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs"
        font-family="'JetBrains Mono','Fira Code',monospace" font-size="46" font-weight="700"
        fill="url(#fg)" letter-spacing="1">CASSIO BONA EULALIO</text>

  <!-- sobreposicao binaria que e apagada revelando o nome -->
  <g clip-path="url(#reveal)">
    <text x="500" y="162" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs"
          font-family="'JetBrains Mono','Fira Code',monospace" font-size="46" font-weight="700"
          fill="url(#fg)" opacity="0.95">01001011000110100101111000110101001110</text>
  </g>

  <!-- cursor -->
  <rect x="884" y="124" width="12" height="42" fill="#FFC400" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="2.9s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitulo -->
  <text x="500" y="204" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" letter-spacing="5" fill="#E3B341" opacity="0">
    DEVOPS · BACKEND · SEGURANÇA
    <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.8s" fill="freeze"/>
  </text>

  <text x="500" y="230" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10" letter-spacing="2" fill="#8B949E" opacity="0">
    chave encontrada · integridade 100%
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.8s" fill="freeze"/>
  </text>

  <rect width="1000" height="260" fill="url(#vig)"/>
</svg>
