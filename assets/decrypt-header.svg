<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" role="img" aria-label="Terminal descriptografando: Cassio Bona Eulalio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <clipPath id="nameClip">
      <rect x="120" y="96" width="0" height="64">
        <animate attributeName="width" from="0" to="760" dur="1.6s" begin="1.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="p1Clip">
      <rect x="26" y="16" width="0" height="30">
        <animate attributeName="width" from="0" to="540" dur="0.9s" begin="0.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="p2Clip">
      <rect x="26" y="36" width="0" height="30">
        <animate attributeName="width" from="0" to="500" dur="0.8s" begin="2.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>

  <!-- camada de binario (fundo) -->
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" letter-spacing="1">
    <animate attributeName="opacity" values="0.22;0.22;0.05" keyTimes="0;0.72;1" dur="4.6s" fill="freeze"/>

    <text x="0" y="22" fill="#1f6feb" opacity="0.9">01000011 01000001 01010011 01010011 01001001 01001111 00100000 01000010 01001111 01001110 01000001 00100000 01000101 01010101 01001100 01000001 01001100 01001001 01001111</text>
    <text x="0" y="46" fill="#2ea043" opacity="0.85">01000100 01000101 01010110 01001111 01010000 01010011 00100000 01000010 01000001 01000011 01001011 01000101 01001110 01000100 00100000 01010011 01000101 01000011 01010101 01010010 01001001 01010100 01011001</text>
    <text x="0" y="70" fill="#1f6feb" opacity="0.8">01001011 01010101 01000010 01000101 01010010 01001110 01000101 01010100 01000101 01010011 00100000 00110011 00110010 00110110 01000011 01000101 00110101</text>
    <text x="0" y="94" fill="#8957e5" opacity="0.8">01010100 01000101 01010010 01010010 01000001 01000110 01001111 01010010 01001101 00100000 01010000 01011001 01010100 01001000 01001111 01001110</text>
    <text x="0" y="118" fill="#1f6feb" opacity="0.7">00110001 00110000 00110001 00110000 00110001 00110001 00110000 00110000 00110001 00110001 00110000 00110001 00110000 00110000 00110001 00110000 00110001 00110001 00110000 00110000</text>
    <text x="0" y="142" fill="#2ea043" opacity="0.65">01100111 01110000 01100111 00101101 01100100 01100101 01100011 01110010 01111001 01110000 01110100 00100000 01101111 01101011 00100000 00110001 00110000 00110000 00100101</text>
    <text x="0" y="166" fill="#1f6feb" opacity="0.6">00110000 00110001 00110001 00110000 00110000 00110001 00110001 00110000 00110001 00110000 00110000 00110001 00110001 00110000 00110001 00110000 00110000 00110001</text>
    <text x="0" y="190" fill="#8957e5" opacity="0.55">01100110 01101111 01110010 01100101 01101110 01110011 01100101 00100000 01101100 01101111 01100111 00101101 01100001 01101110 01100001 01101100 01111001 01110011 01101001 01110011</text>
    <text x="0" y="214" fill="#1f6feb" opacity="0.5">00110001 00110000 00110001 00110001 00110000 00110000 00110001 00110000 00110001 00110001 00110000 00110000 00110001 00110001 00110000 00110000 00110001 00110000 00110001 00110001 00110000 00110000</text>
  </g>

  <!-- scanline -->
  <rect x="0" y="0" width="1000" height="2" fill="#58a6ff" opacity="0.5">
    <animate attributeName="y" values="0;240;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- linha de comando (digitada) -->
  <text x="28" y="32" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#3fb950" clip-path="url(#p1Clip)">root@nest:~# ./decrypt cassio-bona.gpg --binary --force</text>
  <text x="28" y="52" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8b949e" clip-path="url(#p2Clip)">→ chave encontrada · integridade verificada · 100%</text>

  <!-- nome revelado pela descriptografia -->
  <text x="500" y="150" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="1" clip-path="url(#nameClip)">CASSIO BONA EULALIO</text>

  <!-- cursor piscando -->
  <rect x="778" y="116" width="14" height="44" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitulo -->
  <text x="500" y="192" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" letter-spacing="3" fill="#58a6ff" opacity="0">
    DEVOPS · BACKEND · SEGURANÇA
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.8s" fill="freeze"/>
  </text>
</svg>
